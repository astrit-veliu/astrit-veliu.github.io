<!DOCTYPE html>
<html lang="en" data-width="compact" data-height="medium">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b2d30">
  <meta name="description" content="Astrit Veliu, Android software engineer, presented as an Android Studio project.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <title>Astrit Veliu - Android Developer Portfolio</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Roboto:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/css/main.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <div id="welcome" class="welcome"></div>

  <div id="ide" class="ide" data-pane="emulator">
    <header id="titlebar" class="titlebar"></header>
    <div id="progress" class="progress" aria-hidden="true"></div>
    <div class="ide-body">
      <nav id="stripeLeft" class="stripe stripe-left" aria-label="Tool windows"></nav>
      <aside id="explorer" class="explorer" aria-label="Project"></aside>
      <main class="workspace">
        <section id="editor" class="editor-pane" aria-label="Editor"></section>
        <section id="terminal" class="terminal-pane" aria-label="Terminal"></section>
      </main>
      <aside id="emulator" class="emulator-pane" aria-label="Running Devices"></aside>
      <nav id="stripeRight" class="stripe stripe-right" aria-label="Device tool window"></nav>
      <div class="drawer-scrim" data-command="overlay.close"></div>
    </div>
    <footer id="statusbar" class="statusbar"></footer>
    <nav id="paneSwitcher" class="pane-switcher" aria-label="Views"></nav>
  </div>

  <div id="popover" class="popover" hidden></div>
  <div id="palette" class="palette-host" hidden></div>
  <div id="dialog" class="dialog-host" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>This portfolio needs JavaScript to run the Android Studio interface.</noscript>
</body>
</html>
