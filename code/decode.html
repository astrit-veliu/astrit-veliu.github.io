<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f6">
<meta name="description" content="Read QR codes and barcodes from an image, locally in your browser.">
<title>Barcode Studio: Decode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/decode.css">
<script type="module" src="assets/js/decode/main.js"></script>
</head>
<body data-page="decode">
<header class="site-header"></header>

<main class="workspace">
  <section class="panel" aria-labelledby="title">
    <div>
      <h1 id="title">Read a code</h1>
      <p class="muted">Images stay on your device. Nothing is uploaded.</p>
    </div>
    <label id="dropzone" class="dropzone">
      <input type="file" id="file" accept="image/*">
      <strong>Drop an image, click to browse, or paste</strong>
      <span class="muted small">QR, Data Matrix, Aztec, PDF417, Code 128, Code 39, EAN, UPC</span>
    </label>
    <img id="preview" class="preview-img" alt="Uploaded image" hidden>
  </section>

  <section class="panel" aria-live="polite" aria-label="Result">
    <h2>Result</h2>
    <div id="result"><p class="muted">The decoded content appears here.</p></div>
  </section>
</main>
</body>
</html>
