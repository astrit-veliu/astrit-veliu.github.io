<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f6">
<meta name="description" content="Generate QR codes, Data Matrix, Aztec, PDF417, Code 128, Code 39, EAN-13 and UPC-A in your browser.">
<title>Barcode Studio: Generate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/generate.css">
<script type="module" src="assets/js/generate/main.js"></script>
</head>
<body data-page="generate">
<header class="site-header"></header>

<main class="workspace">
  <section class="panel" aria-labelledby="title">
    <div>
      <h1 id="title">Generate a code</h1>
      <p class="muted">Choose a format and type. The preview updates as you go.</p>
    </div>

    <div class="field">
      <span class="label" id="format-label">Format</span>
      <div id="formats" class="chips" role="group" aria-labelledby="format-label"></div>
      <p id="hint" class="muted small"></p>
    </div>

    <div class="field">
      <label class="label" for="content">Content</label>
      <textarea id="content" rows="4" placeholder="Paste a link, a message or a product number" autofocus></textarea>
    </div>

    <div class="row">
      <div class="field">
        <label class="label" for="size">Size</label>
        <select id="size"></select>
      </div>
      <div class="field">
        <label class="label" for="color">Code color</label>
        <input type="color" id="color" value="#000000">
      </div>
    </div>

    <div id="qr-options" class="field">
      <span class="label" id="style-label">Dot style</span>
      <div id="styles" class="chips" role="group" aria-labelledby="style-label"></div>
      <span class="label">Center icon</span>
      <div class="icon-row">
        <label class="btn" for="icon">Upload icon</label>
        <input type="file" id="icon" accept="image/*" hidden>
        <img id="icon-preview" class="icon-preview" alt="Selected icon" hidden>
        <button type="button" id="icon-clear" class="btn" hidden>Remove</button>
      </div>
    </div>
  </section>

  <section class="panel preview" aria-label="Preview">
    <div id="stage" class="stage"></div>
    <div id="actions" class="actions">
      <button type="button" id="download" class="btn primary" disabled>Download PNG</button>
      <button type="button" id="copy" class="btn" disabled>Copy image</button>
      <button type="button" id="native-share" class="btn" disabled>Share image</button>
    </div>
    <div class="field">
      <span class="label">Share the content</span>
      <div id="share" class="share"></div>
    </div>
  </section>
</main>
</body>
</html>
