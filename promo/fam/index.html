<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0612">
<link rel="icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/claim.css">
<title>Promo code</title>
<script type="module" src="js/claim.js"></script>
</head>
<body data-title="copy.claim.pageTitle">
<main class="wrap">
  <app-brand></app-brand>

  <section class="card">
    <span class="pill">
      <i class="fa-solid fa-wand-magic-sparkles"></i>
      <span data-text="copy.claim.eyebrow"></span>
    </span>
    <h1 data-text="copy.claim.title"></h1>
    <p class="desc" data-text="copy.claim.description"></p>

    <div class="steps">
      <a class="btn btn-ghost step-btn" id="storeStep" data-href="store.url" href="#" target="_blank" rel="noopener">
        <span class="step-num">1</span>
        <i class="fa-brands fa-google-play icon-idle"></i>
        <i class="fa-solid fa-circle-check icon-done"></i>
        <span data-text="copy.claim.storeStep"></span>
      </a>

      <button class="btn btn-primary claim-btn" id="claimBtn" type="button" data-state="locked" disabled>
        <span class="step-num">2</span>
        <i class="fa-solid fa-lock icon icon-lock"></i>
        <i class="fa-solid fa-gift icon icon-gift"></i>
        <i class="fa-solid fa-circle-notch fa-spin icon icon-spin"></i>
        <span id="claimLabel"></span>
      </button>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>

  <app-footer></app-footer>
</main>
</body>
</html>
